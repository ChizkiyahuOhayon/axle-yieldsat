name: axle_spatial
learn_grade_scale: true   # learn g(Good/Average/Bad); set false to fix g=1
ell_init: 8.0             # initial correlation length along the swath, in 10 m pixels
rho_init: 0.7             # initial share of acquisition noise that is correlated (0 = M1)
learn_kernel: true        # learn (ell, rho); false pins them for a fixed-kernel ablation
