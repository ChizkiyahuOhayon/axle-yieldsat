[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "axle-yieldsat"
version = "0.1.0"
description = "Acquisition-anchored label noise for robust dense crop-yield regression on YieldSAT"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Zhao Liu", email = "zhao.liu@ucdconnect.ie"}]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "rasterio>=1.3",
    "scikit-learn>=1.3",
    "pyarrow>=12.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
log = ["wandb>=0.16"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
