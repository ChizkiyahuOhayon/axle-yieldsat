name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Unit + smoke tests
        run: pytest -q
      - name: CLI end-to-end (the documented command, on synthetic data)
        run: |
          python scripts/make_synthetic_cache.py --out data/cache/Synthetic --fields 24 --pixels-per-field 60
          python -m axle.train data=synthetic model=lstm loss=axle protocol=cv10 \
            protocol.n_splits=3 train.epochs=2 num_workers=0 hydra.run.dir=outputs/ci
