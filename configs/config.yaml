# AXLE main config. Compose on the CLI, e.g.:
#   python -m axle.train data=germany model=lstm loss=axle protocol=loyo
defaults:
  - data: germany
  - model: lstm
  - loss: axle
  - protocol: cv10
  - _self_

seed: 0
crop: null          # optional single-crop filter, e.g. "wheat"; null = all crops
device: null        # null -> auto (cuda if available)
num_workers: 4

ensemble:
  members: 1        # >1 = deep ensemble (e.g. 5); combine with loss=axle for a reliability-aware DE

# AXLE-M2 only: how field rasters are cut into patches for the correlated NLL.
patch:
  tile: 16              # block side in pixels -> at most tile^2 pixels per patch
  min_pixels: 32        # drop slivers: too few pixels to carry swath structure
  directions: null      # d_f table; null -> <cache_dir>/directions.parquet if it exists

train:
  epochs: 30
  batch_size: 1024      # pixels per step (all losses except axle_spatial)
  patch_batch_size: 32  # patches per step (axle_spatial) ~= 32 x up-to-256 pixels
  lr: 1.0e-3
  weight_decay: 0.0
  grad_clip: 5.0
  log_every: 5

output_dir: outputs/${now:%Y%m%d-%H%M%S}
wandb:
  enabled: false
  project: axle-yieldsat
  entity: null
