name: axle_spatial
learn_grade_scale: true   # learn g(Good/Average/Bad); set false to fix g=1
ell_init: 8.0             # correlation length ALONG the pass, in 10 m pixels (long)
ell_across_init: 3.0      # correlation length ACROSS passes ~ one swath width (short)
rho_init: 0.7             # initial share of acquisition noise that is correlated (0 = M1)
learn_kernel: true        # learn (ell, ell_across, rho); false pins them for an ablation
